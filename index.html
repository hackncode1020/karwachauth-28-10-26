<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mera Chaand Tum Ho 🌙 Happy Karwa Chauth</title>
<meta name="description" content="A Karwa Chauth surprise: the moon rises, the chhalni slides in, and the moon turns into a heart. Type your love's name and press Start.">
<meta property="og:title" content="Mera chaand tum ho 🌙❤️ Happy Karwa Chauth">
<meta property="og:description" content="Type their name, press Start and watch the moon turn into a heart through the chhalni.">
<meta name="theme-color" content="#0a0820">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="sky"></canvas>
<div id="ui">
  <header id="top"><span class="tag">🪔 Karwa Chauth · 29 Oct</span></header>
  <div id="msg">
    <p id="line1"></p>
    <p id="line2"><span id="hk"></span><span id="nm"></span></p>
  </div>
  <div id="hint">The moon is waiting for you… 🌙</div>
  <div id="panel">
    <div id="form">
      <input id="name" type="text" maxlength="18" placeholder="Your love's name" autocomplete="off">
      <button id="go">Start 🌙</button>
    </div>
    <div id="after">
      <button id="replay" class="ghost">↻ Replay</button>
      <button id="share">Share 💌</button>
    </div>
  </div>
  <footer id="foot">Made by <b>@hack.n.code</b></footer>
</div>
<script src="script.js"></script>
</body>
</html>
